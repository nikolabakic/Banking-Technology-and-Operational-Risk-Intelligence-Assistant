[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bankscope-rag"
version = "0.1.0"
description = "RAG assistant for analyzing US bank 10-K filings"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "beautifulsoup4>=4.15,<5.0",
    "lxml>=6.1,<7.0",
    "sec2md==0.1.23",
    "transformers>=4.51,<6.0",
    "bm25s>=0.2.14,<0.3",
    "numpy>=2.0,<3.0",
    "sentence-transformers>=5.0,<6.0",
    "qdrant-client[fastembed]>=1.18,<1.19",
    "fastapi>=0.116,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9",
]
llm = [
    "openai>=1.66,<3.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bankscope*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebooks", "sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
