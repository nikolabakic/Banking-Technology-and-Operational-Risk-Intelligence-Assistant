[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bankscope-rag"
version = "0.1.0"
description = "RAG assistant for analyzing US bank 10-K filings"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "beautifulsoup4>=4.15,<5.0",
    "lxml>=6.1,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bankscope*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]